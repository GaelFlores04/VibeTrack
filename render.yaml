services:
  - type: web
    name: vibetrack
    runtime: docker
    plan: free
    branch: mejora-algoritmo
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: LASTFM_API_KEY
        sync: false
